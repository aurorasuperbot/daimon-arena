name: Migration

# Triggered when an Issue with the `migration` label is opened.
# One-time local state transfer to arena server state.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: arbiter-state-writer
  cancel-in-progress: false

jobs:
  migrate:
    if: contains(github.event.issue.labels.*.name, 'migration')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout arena
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install daimon engine
        env:
          ENGINE_READ_TOKEN: ${{ secrets.ENGINE_READ_TOKEN }}
        run: |
          if [ -z "$ENGINE_READ_TOKEN" ]; then
            echo "::error::ENGINE_READ_TOKEN secret not set"
            exit 1
          fi
          git config --global url."https://x-access-token:${ENGINE_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
          pip install "git+https://github.com/aurorasuperbot/daimon.git@v2.3.0"
          git config --global --unset url."https://x-access-token:${ENGINE_READ_TOKEN}@github.com/".insteadOf

      - name: Self-test
        run: python scripts/process_migration.py --self-test

      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Fetch Issue body + author
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          mkdir -p /tmp/claim
          gh issue view "$ISSUE_NUMBER" --json body --jq .body > /tmp/claim/body.txt
          AUTHOR=$(gh issue view "$ISSUE_NUMBER" --json author --jq .author.login)
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"

      - name: Process migration
        id: migrate
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUTHOR: ${{ steps.fetch.outputs.author }}
        run: |
          python scripts/process_migration.py \
            --issue-number "$ISSUE_NUMBER" \
            --issue-author "$AUTHOR" \
            --body-file /tmp/claim/body.txt \
            --arena-root . \
            > /tmp/claim/result.json
          cat /tmp/claim/result.json
          OK=$(jq -r .ok /tmp/claim/result.json)
          BALANCE=$(jq -r '.balance_added // ""' /tmp/claim/result.json)
          CARDS=$(jq -r '.cards_added // ""' /tmp/claim/result.json)
          TOTAL=$(jq -r '.balance_after // ""' /tmp/claim/result.json)
          MSG=$(jq -r '.message // ""' /tmp/claim/result.json)
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          echo "balance=$BALANCE" >> "$GITHUB_OUTPUT"
          echo "cards=$CARDS" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          {
            echo "message<<__EOF__"
            echo "$MSG"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Commit + close on success
        if: steps.migrate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUTHOR: ${{ steps.fetch.outputs.author }}
          BALANCE: ${{ steps.migrate.outputs.balance }}
          CARDS: ${{ steps.migrate.outputs.cards }}
          TOTAL: ${{ steps.migrate.outputs.total }}
        run: |
          git config user.name  "daimon-arbiter[bot]"
          git config user.email "arbiter@aurorasuperbot.local"
          git add state/ players/
          if ! git diff --cached --quiet; then
            git commit -m "migration: $AUTHOR — +${BALANCE}¤, ${CARDS} cards (#$ISSUE_NUMBER)"
            for attempt in 1 2 3; do
              if git push; then
                echo "::notice::migration pushed on attempt $attempt"
                break
              fi
              echo "::warning::push attempt $attempt rejected; rebasing"
              git pull --rebase origin main
              [ $attempt -eq 3 ] && exit 1
            done
          fi
          gh issue comment "$ISSUE_NUMBER" \
            --body "Migration complete! +${BALANCE}¤ balance, ${CARDS} cards transferred. Total balance: ${TOTAL}¤." \
            || true
          gh issue edit "$ISSUE_NUMBER" --add-label "claimed" --remove-label "pending-arbiter" || true
          gh issue lock "$ISSUE_NUMBER" --reason resolved || true
          gh issue close "$ISSUE_NUMBER" --reason completed || true

      - name: Migration rejected — comment + close
        if: steps.migrate.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MESSAGE: ${{ steps.migrate.outputs.message }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "Migration rejected: $MESSAGE" \
            || true
          gh issue edit "$ISSUE_NUMBER" --add-label "rejected" --remove-label "pending-arbiter" || true
          gh issue close "$ISSUE_NUMBER" --reason "not planned" || true
