name: Arbiter

# Triggered when a match-challenge Issue receives a comment that completes the
# commit-reveal protocol. Pulls comment bodies via the GH API, runs the canonical
# engine in scripts/arbitrate.py, commits matches/<id>.json + leaderboard.json,
# locks + closes the Issue.
#
# State machine (drives this workflow):
#   1. Issue opened from match-challenge template with `loadout_commit:` in body
#   2. Opponent comments with `/accept` block (`opponent_pubkey:`, `loadout_commit:`)
#   3. Each player posts a `/reveal` comment containing fenced JSON loadout +
#      `pubkey:` + `nonce:` + `signature:`. The arbiter dispatches each
#      reveal to the correct side by embedded pubkey, so the comments may
#      arrive in either order — responder may reveal before challenger.
#   4. The 4th relevant comment (or 3rd, if both phases pass) triggers settlement.
#
# Cross-repo engine pull:
#   The arbiter needs the `daimon` engine. Until the engine is on PyPI we install
#   from the private engine repo using ENGINE_READ_TOKEN — a fine-grained PAT
#   scoped to repo:read on aurorasuperbot/daimon. If the secret is absent the
#   workflow falls back to running the SELF-TEST only (the script is still the
#   single source of truth; the workflow is a thin wrapper).

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to arbitrate"
        required: true

permissions:
  contents: write
  issues: write

# Serialize arbiter runs PER ISSUE so /accept + 2 /reveal comments don't
# fire 3 concurrent runs that race each other on `git push`. Without this,
# only one push lands and the rest hit `! [rejected] (fetch first)`. The
# arbiter is idempotent at the script layer (settled_match_ids guard +
# write_match_record refuses to overwrite different content), but funneling
# through one runner per issue is cheaper, gives clean logs, and prevents
# any future cross-step races (e.g. a label transition between phases).
#
# `cancel-in-progress: false` — never cancel a queued/running arbiter,
# just queue the new one behind it. The 2nd/3rd runs become near-no-ops
# (the matches/N.json already exists with same content; settled_match_ids
# already lists this issue), but they still need to complete normally so
# the issue_comment trigger doesn't get stuck "in progress" forever.
concurrency:
  group: arbiter-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  arbitrate:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue &&
       contains(github.event.issue.labels.*.name, 'match-challenge') &&
       github.event.comment.author_association != 'NONE')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout arena
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install daimon engine
        id: install_engine
        env:
          ENGINE_READ_TOKEN: ${{ secrets.ENGINE_READ_TOKEN }}
        run: |
          if [ -z "$ENGINE_READ_TOKEN" ]; then
            echo "engine_available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ENGINE_READ_TOKEN secret not set; arbiter will only self-test."
            pip install cryptography
          else
            git config --global url."https://x-access-token:${ENGINE_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
            pip install "git+https://github.com/aurorasuperbot/daimon.git@v2.5.0"
            git config --global --unset url."https://x-access-token:${ENGINE_READ_TOKEN}@github.com/".insteadOf
            echo "engine_available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run arbiter self-test
        # Always runs — proves the script is wired correctly, even if no real
        # match has happened yet.
        if: steps.install_engine.outputs.engine_available == 'true'
        run: python scripts/arbitrate.py --self-test

      - name: Determine issue number
        id: issue
        env:
          ISSUE_INPUT: ${{ inputs.issue_number }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
        run: |
          NUM="${ISSUE_INPUT:-$EVENT_ISSUE}"
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Sync to latest main + skip if already settled
        # actions/checkout pins to the SHA that triggered the workflow. With
        # the per-issue `concurrency` group above, runs serialize correctly,
        # but a queued run still checks out the *event-time* SHA — which
        # predates the in-flight run's settlement push. Syncing to current
        # `main` here drops that stale snapshot and lets the idempotency
        # guards in scripts/arbitrate.py recognize "already settled" cleanly.
        #
        # If matches/<issue>.json is already on main, the prior run did the
        # work — skip the rest of this run instead of building a duplicate
        # commit that would just fail to push and pollute the run log.
        id: sync
        if: steps.install_engine.outputs.engine_available == 'true'
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          git fetch origin main
          git reset --hard origin/main
          if [ -f "matches/$ISSUE_NUMBER.json" ]; then
            echo "::notice::matches/$ISSUE_NUMBER.json already on main — another arbiter run already settled this match; exiting cleanly"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Issue + comments
        id: fetch
        if: steps.install_engine.outputs.engine_available == 'true' && steps.sync.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/arbiter
          gh issue view "$ISSUE_NUMBER" --json body --jq .body > /tmp/arbiter/challenge.txt
          if ! gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments?per_page=100" \
               --paginate > /tmp/arbiter/comments_raw.json; then
            echo "::warning::Failed to fetch comments for issue $ISSUE_NUMBER"
            echo "ready=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python <<'EOF'
          import json, sys
          from pathlib import Path

          raw = Path("/tmp/arbiter/comments_raw.json").read_text()
          comments = json.loads(raw)
          if len(comments) > 200:
              print(f"::warning::Truncating {len(comments)} comments to 200")
              comments = comments[:200]

          challenge_kv = {}
          chal_text = Path("/tmp/arbiter/challenge.txt").read_text()
          import re
          for m in re.finditer(r"^\s*([a-zA-Z_]\w*)\s*:\s*(.+?)\s*$", chal_text, re.MULTILINE):
              challenge_kv[m.group(1).lower()] = m.group(2)
          challenger_pk = challenge_kv.get("challenger_pubkey", "").strip().lower()
          opponent_pk = challenge_kv.get("opponent_pubkey", "").strip().lower()

          accept_body = ""
          reveal_bodies = []
          for c in comments:
              body = c.get("body", "")
              author = c.get("user", {}).get("login", "").lower()
              assoc = c.get("author_association", "NONE")
              low = body.strip().lower()

              if assoc == "NONE":
                  continue

              if not accept_body and low.startswith("/accept"):
                  accept_body = body
              elif "/reveal" in low and "nonce:" in low and "pubkey:" in low:
                  reveal_bodies.append(body)
                  if len(reveal_bodies) == 2:
                      break

          Path("/tmp/arbiter/accept.txt").write_text(accept_body)
          Path("/tmp/arbiter/reveal_1.txt").write_text(reveal_bodies[0] if len(reveal_bodies) >= 1 else "")
          Path("/tmp/arbiter/reveal_2.txt").write_text(reveal_bodies[1] if len(reveal_bodies) >= 2 else "")
          have_all = bool(accept_body and len(reveal_bodies) == 2)
          print(f"::notice::accept={bool(accept_body)} reveals={len(reveal_bodies)}")
          Path("/tmp/arbiter/ready").write_text("1" if have_all else "0")
          EOF
          READY=$(cat /tmp/arbiter/ready)
          echo "ready=$READY" >> "$GITHUB_OUTPUT"

      - name: Arbitrate
        if: steps.fetch.outputs.ready == '1'
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          python scripts/arbitrate.py \
            --issue-number "$ISSUE_NUMBER" \
            --challenge-body /tmp/arbiter/challenge.txt \
            --accept-body    /tmp/arbiter/accept.txt \
            --reveal-1-body  /tmp/arbiter/reveal_1.txt \
            --reveal-2-body  /tmp/arbiter/reveal_2.txt \
            --arena-root     . \
            > /tmp/arbiter/result.json

      - name: Commit + close on success
        if: steps.fetch.outputs.ready == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          git config user.name  "daimon-arbiter[bot]"
          git config user.email "arbiter@aurorasuperbot.local"
          git add matches/ leaderboard.json
          if ! git diff --cached --quiet; then
            git commit -m "arbiter: settle match #$ISSUE_NUMBER"
            # Defensive rebase + push retry. The `concurrency` group above
            # already serializes per-issue, but a sibling workflow
            # (mining-audit, validator post-edit, trade-settle) can land
            # a commit on `main` between our checkout and our push. Rather
            # than fail-loud and require manual re-dispatch, rebase onto
            # the latest tip and try once more. The arbiter changes are
            # confined to matches/ and leaderboard.json, so a rebase is
            # always semantically safe (no merge conflicts possible
            # against unrelated workflow commits).
            for attempt in 1 2 3; do
              if git push; then
                echo "::notice::arbiter pushed on attempt $attempt"
                break
              fi
              echo "::warning::push attempt $attempt rejected; rebasing"
              git pull --rebase origin main
              [ $attempt -eq 3 ] && exit 1
            done
          fi
          # Post outcome to Issue. All three are best-effort (`|| true`):
          # if a prior arbiter run already posted the comment + locked +
          # closed the issue, GitHub will reject these as duplicates /
          # locked-issue errors. We don't want to fail the whole run for a
          # cosmetic-only retry — the canonical artifact is matches/N.json,
          # which the prior run already pushed.
          if [ -f /tmp/arbiter/result.json ]; then
            WINNER=$(jq -r .winner /tmp/arbiter/result.json)
            REASON=$(jq -r .reason /tmp/arbiter/result.json)
            HP_A=$(jq -r .side_a_final_hp /tmp/arbiter/result.json)
            HP_B=$(jq -r .side_b_final_hp /tmp/arbiter/result.json)
            gh issue comment "$ISSUE_NUMBER" --body "Arbitrated. winner=$WINNER reason=$REASON hp=$HP_A/$HP_B. See \`matches/$ISSUE_NUMBER.json\`." || true
            gh issue lock "$ISSUE_NUMBER" --reason resolved || true
            gh issue close "$ISSUE_NUMBER" --reason completed || true
          fi
